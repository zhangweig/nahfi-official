<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAHFI.ASIA - ASTRAL TERMINAL</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/globe.gl"></script>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#000;
overflow:hidden;
font-family:'JetBrains Mono',monospace;
color:#fff;
}

.scanlines{
position:absolute;
inset:0;
background:linear-gradient(to bottom,
rgba(255,255,255,0) 50%,
rgba(0,0,0,0.25) 50%);
background-size:100% 4px;
pointer-events:none;
z-index:50;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useEffect,useRef,useState}=React;

const CITIES_DATA=[

{
id:'cdc',
name:'成都',
label:'CDC',
lat:30.6586,
lng:104.0648
},

{
id:'gosh',
name:'重庆',
label:'GO$H',
lat:29.5630,
lng:106.5516
},

{
id:'csc',
name:'长沙',
label:'CSC',
lat:28.2282,
lng:112.9388
},

{
id:'beijing',
name:'北京',
label:'BJ',
lat:39.9042,
lng:116.4074
},

{
id:'xian',
name:'西安',
label:'NOUS',
lat:34.3416,
lng:108.9398
},

{
id:'nanjing',
name:'南京',
label:'Free-Out',
lat:32.0603,
lng:118.7969
},

{
id:'urumqi',
name:'乌鲁木齐',
label:'XJ',
lat:43.8256,
lng:87.6168
}

]

const ARCS_DATA=[

{startLat:30.6586,startLng:104.0648,endLat:29.5630,endLng:106.5516},
{startLat:28.2282,startLng:112.9388,endLat:30.6586,endLng:104.0648},
{startLat:39.9042,startLng:116.4074,endLat:34.3416,endLng:108.9398},
{startLat:32.0603,startLng:118.7969,endLat:28.2282,endLng:112.9388},

{startLat:43.8256,startLng:87.6168,endLat:30.6586,endLng:104.0648}

]

function App(){

const globeRef=useRef()

useEffect(()=>{

const globe=Globe()(globeRef.current)

.backgroundColor('rgba(0,0,0,0)')

.globeMaterial(

new THREE.MeshPhongMaterial({
color:0x000000,
shininess:0
})

)

.showAtmosphere(true)
.atmosphereColor('#ffffff')
.atmosphereAltitude(0.1)

.showGraticules(true)

.pointOfView({
lat:35,
lng:105,
altitude:1.8
})

.polygonsTransitionDuration(300)

.polygonCapColor(()=> 'rgba(255,255,255,0.05)')
.polygonSideColor(()=> 'rgba(0,0,0,0)')
.polygonStrokeColor(()=> 'rgba(255,255,255,0.25)')

.arcsData(ARCS_DATA)
.arcColor(()=> '#ffffff')
.arcDashLength(0.4)
.arcDashGap(4)
.arcDashInitialGap(()=>Math.random()*5)
.arcDashAnimateTime(3000)
.arcAltitudeAutoScale(0.3)

.htmlElementsData(CITIES_DATA)

.htmlElement(d=>{

const el=document.createElement("div")

el.style.transform="translate(-50%,-50%)"
el.style.pointerEvents="auto"

el.innerHTML=`

<div class="flex flex-col items-center">

<div class="w-2 h-2 bg-white border border-black mb-1"></div>

<div class="text-[10px] bg-black/80 px-1 border border-white/40">
${d.name}
</div>

<div class="text-[8px] opacity-60">
${d.label}
</div>

</div>

`

return el

})

fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
.then(res=>res.json())
.then(data=>{

globe.polygonsData(data.features)

})

globe.controls().autoRotate=true
globe.controls().autoRotateSpeed=0.3

},[])

return(

<div className="w-screen h-screen">

<div ref={globeRef}
className="w-full h-full"></div>

<div className="scanlines"></div>

</div>

)

}

const root=ReactDOM.createRoot(document.getElementById("root"))

root.render(<App/>)

</script>

</body>
</html>
