<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nahfi - Minimalist Archive</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.68/build/spline-viewer.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700&display=swap');
    
    body {
      background-color: #000;
      color: #888;
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
      margin: 0;
      overflow-x: hidden;
    }

    /* 全屏 3D 背景 */
    .hero-3d {
      position: relative;
      height: 100vh;
      width: 100%;
      background: #000;
    }

    /* 极致极简 Logo */
    .minimal-logo {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 50;
      opacity: 0.2; /* 初始几乎看不见 */
      transition: opacity 0.8s ease;
      width: 40px;
    }
    .minimal-logo:hover { opacity: 0.8; }

    /* 右侧游戏化菜单 - 降低视觉存在感 */
    .glass-menu {
      position: absolute;
      right: 3rem;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.01); /* 几乎全透明 */
      backdrop-filter: blur(30px) saturate(120%);
      -webkit-backdrop-filter: blur(30px);
      border-left: 1px solid rgba(255, 255, 255, 0.03);
      padding: 3rem 1.5rem;
      z-index: 20;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 160px;
      height: 44px;
      margin: 0.8rem 0;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 2px; /* 趋向方正，更具硬朗感 */
      transition: all 0.5s ease;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: #444;
      text-transform: uppercase;
      cursor: pointer;
    }

    .menu-item:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #eee;
      transform: scale(1.02);
    }

    .menu-item.active {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border: none;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    /* 几乎看不见的滚动指示器 - 线条化 */
    .scroll-line {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
      z-index: 10;
      overflow: hidden;
    }
    .scroll-line::after {
      content: '';
      position: absolute;
      top: -60px;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      animation: lineFlow 3s infinite ease-in-out;
    }
    @keyframes lineFlow {
      0% { top: -60px; opacity: 0; }
      50% { opacity: 0.5; }
      100% { top: 60px; opacity: 0; }
    }

    /* 渐变遮罩层，提升 3D 的悬浮感 */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 5;
    }

    spline-viewer { outline: none; }
  </style>
</head>
<body>

  <div class="minimal-logo">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 10L90 90M90 10L10 90" stroke="white" stroke-width="0.5"/>
      <circle cx="50" cy="50" r="1.5" fill="white"/>
    </svg>
  </div>

  <section class="hero-3d">
    <div class="vignette-overlay"></div>
    
    <spline-viewer id="nahfiViewer" url="https://prod.spline.design/qefAA4ph1RCs2Hxm/scene.splinecode"></spline-viewer>

    <div class="glass-menu">
      <p class="text-[8px] text-gray-800 mb-10 text-center tracking-[0.8em] uppercase font-bold">Menu</p>
      
      <button class="menu-item active" data-action="idle">Original</button>
      <button class="menu-item" data-action="action_01">Motion</button>
      <button class="menu-item" data-action="action_02">Secondary</button>
      
      <div class="mt-16 pt-8 border-t border-white/5 text-[8px] text-center text-gray-800 leading-relaxed tracking-[0.3em]">
        L-DRAG | R-ZOOM
      </div>
    </div>

    <div class="scroll-line"></div>
  </section>

  <section id="blog" class="py-40 bg-black">
    <div class="container mx-auto max-w-3xl px-8">
      <div class="space-y-32">
        <article class="opacity-40 hover:opacity-100 transition duration-1000">
          <div class="flex items-center space-x-4 mb-4">
            <span class="text-[9px] font-mono text-gray-700 tracking-[0.4em]">LOG_ID: 2026_03</span>
          </div>
          <h3 class="text-xl font-light text-white tracking-widest mb-4">Digital Density Optimization</h3>
          <p class="text-gray-600 leading-loose text-xs tracking-wide">
            在 V0.82 版本中，我们剥离了多余的视觉噪音。现在的重点在于如何通过最少的像素表达最丰富的数据。
          </p>
        </article>
      </div>
    </div>
  </section>

  <footer class="py-10 text-center opacity-20 hover:opacity-50 transition">
    <p class="text-[8px] tracking-[1em] font-light">© NAHFI ASIA</p>
  </footer>

  <script type="module">
    const viewer = document.getElementById('nahfiViewer');
    const buttons = document.querySelectorAll('.menu-item');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const action = btn.getAttribute('data-action');
        // 后续可以在这里通过 viewer.emitEvent 触发 Spline 动效
      });
    });
  </script>

</body>
</html>
