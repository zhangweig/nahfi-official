<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAHFI.ASIA - 中文说唱地下博物馆 (3D全息地球版)</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 和 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- 引入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 💡 引入 3D 渲染核心库 Three.js 与 Globe.gl -->
  <!-- 修复了 ReferenceError: exports is not defined，使用了具体的 build 路径 -->
  <script src="https://unpkg.com/three/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    body { margin: 0; background-color: #09090b; overflow: hidden; font-family: sans-serif; }
    /* 扫描线与噪点遮罩 */
    .crt-overlay {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 50;
    }
    /* 故障文字特效 */
    .glitch-text { position: relative; }
    .glitch-text::before, .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8; pointer-events: none;
    }
    .glitch-text::before {
      left: 2px; text-shadow: -2px 0 red; clip: rect(24px, 550px, 90px, 0);
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }
    .glitch-text::after {
      left: -2px; text-shadow: -2px 0 cyan; clip: rect(85px, 550px, 140px, 0);
      animation: glitch-anim 2.5s infinite linear alternate-reverse;
    }
    @keyframes glitch-anim {
      0% { clip: rect(10px, 9999px, 44px, 0); }
      20% { clip: rect(85px, 9999px, 59px, 0); }
      40% { clip: rect(14px, 9999px, 29px, 0); }
      60% { clip: rect(66px, 9999px, 56px, 0); }
      80% { clip: rect(98px, 9999px, 89px, 0); }
      100% { clip: rect(43px, 9999px, 12px, 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip: rect(65px, 9999px, 100px, 0); }
      20% { clip: rect(3px, 9999px, 4px, 0); }
      40% { clip: rect(89px, 9999px, 83px, 0); }
      60% { clip: rect(12px, 9999px, 34px, 0); }
      80% { clip: rect(54px, 9999px, 78px, 0); }
      100% { clip: rect(23px, 9999px, 19px, 0); }
    }
    /* 隐藏滚动条 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 确保地球上方的 HTML 元素可以被点击 */
    .scene-container .scene-tooltip { pointer-events: auto !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 图标组件 ---
    const IconMic2 = ({className, size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 8-9.04 9.06a2.828 2.828 0 1 0 3.98 3.98L16 12"/><circle cx="17" cy="7" r="5"/></svg>;
    const IconX = ({className, size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconRadio = ({className, size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="2"/><path d="M4.93 10.93a10 10 0 0 1 14.14 0"/><path d="M2 18h20"/><path d="M8.46 14.46a5 5 0 0 1 7.08 0"/></svg>;
    const IconPlay = ({className, size=24, fill="none"}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
    const IconPause = ({className, size=24, fill="none"}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
    const IconVolume2 = ({className, size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
    const IconUser = ({className, size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const IconMusic = ({className, size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>;
    const IconMapPin = ({className, size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>;
    const IconGlobe = ({className, size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>;

    // ==========================================
    // 💡 后期维护指南：在这里添加/修改城市点位
    // 使用真实的纬度 (lat) 和经度 (lng) 来在地球上定位！
    // ==========================================
    const CITIES_DATA = [
      {
        id: 'cdc', name: '成都', label: 'CDC',
        lat: 30.6586, lng: 104.0648,  // 真实经纬度
        color: 'text-cyan-400', bgColor: 'bg-cyan-400', hexColor: '#22d3ee',
        glow: 'shadow-[0_0_20px_rgba(34,211,238,0.8)]',
        style: 'Trap / 休闲与凶狠的结合',
        desc: '作为中文Trap的绝对重镇，成都的嘻哈音乐完美融合了市井的茶馆文化和国际化的808鼓点。这里的Rapper操着极具辨识度的西南官话，看似慵懒随性，但做出来的Beat和Flow却极具攻击性与前瞻性。',
        rappers: ['Higher Brothers (马思唯, KnowKnow...)', '谢帝 (Boss Shady)', 'Ty.', '王以太', '李尔新']
      },
      {
        id: 'gosh', name: '重庆', label: 'GO$H',
        lat: 29.5630, lng: 106.5516,
        color: 'text-red-500', bgColor: 'bg-red-500', hexColor: '#ef4444',
        glow: 'shadow-[0_0_20px_rgba(239,68,68,0.8)]',
        style: 'Trap / 勒是雾都的江湖气',
        desc: '重庆是一座赛博朋克与魔幻现实交织的3D城市，这里的说唱充满了山城防空洞里的粗粝感与市井兄弟情。方言的声调让重庆Trap拥有独特的咬字节奏，现场永远是最躁的。',
        rappers: ['GAI周延', 'Bridge布瑞吉', 'L4WUDU (雾都)', '王齐铭', 'K Eleven']
      },
      {
        id: 'csc', name: '长沙', label: 'CSC',
        lat: 28.2282, lng: 112.9388,
        color: 'text-orange-500', bgColor: 'bg-orange-500', hexColor: '#f97316',
        glow: 'shadow-[0_0_20px_rgba(249,115,22,0.8)]',
        style: 'Boombap / 江湖流与湘江词魂',
        desc: 'CSC代表着中文说唱歌词的灵魂深度。长沙说唱扎根于街头，以硬核的BoomBap风格为主，歌词如同湘菜一样火辣直接，讲述着底层的奋斗、兄弟情义和真正的“江湖流”。',
        rappers: ['C-Block (大傻, 功夫胖, 刘聪)', '西奥Sio', 'Ranzer', 'Yee']
      },
      {
        id: 'beijing', name: '北京', label: 'BJ Underground',
        lat: 39.9042, lng: 116.4074,
        color: 'text-yellow-400', bgColor: 'bg-yellow-400', hexColor: '#facc15',
        glow: 'shadow-[0_0_20px_rgba(250,204,21,0.8)]',
        style: 'Old School / 地下启蒙与叙事',
        desc: '作为中文说唱的发源地之一，北京的Hip-Hop带着深深的地下皇城根底色。从Iron Mic的地下室到各大Livehouse，这里的说唱更注重叙事、双关语和纯正的Old School味道。',
        rappers: ['隐藏 (Yin Ts\'ang)', '王波 (Webber)', '龙井说唱', '阴三儿 (In3)', '辉子']
      },
      {
        id: 'nanjing', name: '南京', label: 'Free-Out',
        lat: 32.0603, lng: 118.7969,
        color: 'text-purple-500', bgColor: 'bg-purple-500', hexColor: '#a855f7',
        glow: 'shadow-[0_0_20px_rgba(168,85,247,0.8)]',
        style: 'Boombap & Melodic / 诗意与凶狠',
        desc: '金陵城的说唱带着一种独特的文学质感与硬核态度的碰撞。Free-Out厂牌不仅保留了街头的一面，也在旋律说唱和意识流词作上独树一帜。',
        rappers: ['光光 (MC 光光)', 'Ice Paper', 'Round_2', 'Trouble.Z']
      },
      {
        id: 'xian', name: '西安', label: 'NOUS',
        lat: 34.3416, lng: 108.9398,
        color: 'text-emerald-400', bgColor: 'bg-emerald-400', hexColor: '#34d399',
        glow: 'shadow-[0_0_20px_rgba(52,211,153,0.8)]',
        style: 'Conscious / 思想与技巧的巅峰',
        desc: '十三朝古都孕育了中文说唱圈最顶尖的技术流和思想派。NOUS厂牌以极其复杂的韵脚编排、深刻的社会反思和纯正的Hip-Hop精神，被誉为中文说唱的“少林寺”。',
        rappers: ['派克特 (PACT)', 'Cream D', '辛巴 (SIMBA)', '张昊']
      }
    ];

    // 城市间的网络弧线数据 (模拟厂牌间的连结与碰撞)
    const ARCS_DATA = [
      { startLat: 30.6586, startLng: 104.0648, endLat: 29.5630, endLng: 106.5516 }, // 成都 - 重庆
      { startLat: 28.2282, startLng: 112.9388, endLat: 30.6586, endLng: 104.0648 }, // 长沙 - 成都
      { startLat: 39.9042, startLng: 116.4074, endLat: 34.3416, endLng: 108.9398 }, // 北京 - 西安
      { startLat: 32.0603, startLng: 118.7969, endLat: 28.2282, endLng: 112.9388 }, // 南京 - 长沙
      { startLat: 34.3416, startLng: 108.9398, endLat: 30.6586, endLng: 104.0648 }  // 西安 - 成都
    ];

    // ==========================================
    // 主应用组件
    // ==========================================
    function NahfiHipHopMuseum() {
      const globeElRef = useRef(null);
      const globeInstanceRef = useRef(null);
      
      const [isPlaying, setIsPlaying] = useState(false);
      const [activeCity, setActiveCity] = useState(null);

      // --- 核心：初始化 3D 地球 ---
      useEffect(() => {
        if (!globeElRef.current) return;

        // 创建 Globe 实例
        const globe = Globe()(globeElRef.current)
          .backgroundColor('rgba(0,0,0,0)') // 透明背景以显示底层网格
          .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg') // 黑色质感地球地图
          .showAtmosphere(true)
          .atmosphereColor('#22d3ee') // 青色大气层发光
          .atmosphereAltitude(0.2)
          .pointOfView({ lat: 35, lng: 105, altitude: 1.5 }) // 初始视角聚焦中国区域
          
          // 渲染厂牌之间的流光弧线
          .arcsData(ARCS_DATA)
          .arcColor(() => '#ef4444') // 红色电波
          .arcDashLength(0.4)
          .arcDashGap(4)
          .arcDashInitialGap(() => Math.random() * 5)
          .arcDashAnimateTime(2000)
          .arcAltitudeAutoScale(0.3)

          // 渲染城市交互节点 (注入我们之前的 Tailwind CSS HTML 元素)
          .htmlElementsData(CITIES_DATA)
          .htmlElement(d => {
            const el = document.createElement('div');
            // 将点位锚点居中
            el.style.transform = "translate(-50%, -50%)"; 
            el.style.pointerEvents = "auto";
            el.style.cursor = "pointer";
            
            // 沿用之前的炫酷呼吸灯和文字 HTML
            el.innerHTML = `
              <div class="relative group flex flex-col items-center">
                <div class="absolute -inset-4 rounded-full opacity-0 group-hover:opacity-40 transition-opacity duration-300 blur-md ${d.bgColor}"></div>
                <div class="absolute inset-0 rounded-full animate-ping opacity-50 ${d.bgColor}"></div>
                <div class="w-4 h-4 md:w-5 md:h-5 rounded-full border-2 border-zinc-900 relative z-10 transition-transform duration-300 ${d.bgColor} ${d.glow} group-hover:scale-150"></div>
                <div class="absolute top-full mt-2 flex flex-col items-center opacity-80 group-hover:opacity-100 transition-all duration-300">
                  <div class="px-2 py-1 bg-zinc-900/80 backdrop-blur-md border border-zinc-700 text-zinc-300 text-[10px] md:text-xs font-bold uppercase tracking-widest whitespace-nowrap shadow-lg">
                    ${d.label}
                  </div>
                </div>
              </div>
            `;
            
            // 绑定点击事件，由于在闭包内，直接调用 React 的 setter 是安全的
            el.onclick = () => setActiveCity(d);
            return el;
          });

        // 开启自动旋转
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.5;
        // 限制缩放距离
        globe.controls().minDistance = 150;
        globe.controls().maxDistance = 500;

        globeInstanceRef.current = globe;

        // 监听窗口大小改变以重绘地球
        const handleResize = () => {
          if(globeElRef.current && globeInstanceRef.current) {
            globeInstanceRef.current.width(globeElRef.current.clientWidth);
            globeInstanceRef.current.height(globeElRef.current.clientHeight);
          }
        };
        window.addEventListener('resize', handleResize);
        
        return () => window.removeEventListener('resize', handleResize);
      }, []); // 空依赖，只挂载一次

      // --- 视角控制：当选中城市时，转动并拉近镜头 ---
      useEffect(() => {
        if (globeInstanceRef.current) {
          if (activeCity) {
            // 停止自动旋转并飞向对应城市
            globeInstanceRef.current.controls().autoRotate = false;
            globeInstanceRef.current.pointOfView(
              { lat: activeCity.lat, lng: activeCity.lng, altitude: 0.6 }, 
              1500 // 飞行动画时间 1.5 秒
            );
          } else {
            // 恢复全局视角和自动旋转
            globeInstanceRef.current.controls().autoRotate = true;
            globeInstanceRef.current.pointOfView({ lat: 35, lng: 105, altitude: 1.5 }, 1500);
          }
        }
      }, [activeCity]);

      // 关闭面板
      const closePanel = () => setActiveCity(null);

      return (
        <div className="h-screen w-screen bg-zinc-950 text-zinc-100 font-sans selection:bg-red-500 selection:text-white relative flex flex-col">
          
          {/* 全局噪点背景和扫描线 */}
          <div className="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:64px_64px]"></div>
          <div className="absolute inset-0 crt-overlay pointer-events-none"></div>

          {/* --- 顶部导航 --- */}
          <header className="absolute top-0 w-full z-40 border-b border-zinc-800/50 bg-zinc-950/50 backdrop-blur-md">
            <div className="max-w-screen-2xl mx-auto px-6 py-4 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <IconMic2 className="text-red-500 animate-pulse" />
                <span className="font-black text-xl tracking-tighter uppercase glitch-text" data-text="NAHFI.ASIA">
                  NAHFI<span className="text-red-500">.ASIA</span>
                </span>
                <span className="hidden md:inline-block ml-4 text-xs font-mono text-zinc-500 border border-zinc-800 px-2 py-1 rounded bg-zinc-900/50">
                  SYSTEM_STATUS: ONLINE
                </span>
              </div>
              <div className="text-xs font-bold tracking-[0.3em] uppercase text-zinc-400 hidden sm:block">
                3D 全息说唱地理视图
              </div>
            </div>
          </header>

          {/* --- 核心交互区域：容纳 3D 地球 --- */}
          <main className="flex-1 relative z-10 w-full h-full overflow-hidden">
            
            {/* Globe 容器：铺满整个区域 */}
            <div ref={globeElRef} className="absolute inset-0 w-full h-full cursor-move active:cursor-grabbing"></div>

            {/* 提示文案层 (在没有点击任何城市时悬浮显示) */}
            {!activeCity && (
              <div className="absolute bottom-28 left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none">
                <div className="text-4xl md:text-6xl font-black uppercase tracking-tighter text-zinc-800 opacity-50 mb-4 drop-shadow-md">
                  HIP-HOP GLOBE
                </div>
                <div className="text-zinc-400 text-sm font-mono tracking-widest animate-pulse flex items-center gap-2 bg-zinc-900/80 px-4 py-2 rounded-full border border-zinc-800 backdrop-blur-sm shadow-xl">
                  <IconGlobe size={16} className="text-cyan-400" />
                  拖动地球 · 点击节点解密当地厂牌
                </div>
              </div>
            )}
          </main>

          {/* ========================================== */}
          {/* 右侧/底部滑动档案面板 (点击城市后弹出) */}
          {/* ========================================== */}
          <div className={`fixed inset-y-0 right-0 w-full md:w-[450px] bg-zinc-950/90 backdrop-blur-xl border-l border-zinc-800 z-50 transform transition-transform duration-500 ease-[cubic-bezier(0.19,1,0.22,1)] flex flex-col shadow-[-20px_0_50px_rgba(0,0,0,0.8)] ${activeCity ? 'translate-x-0' : 'translate-x-full'}`}>
            
            {activeCity && (
              <>
                {/* 顶部标题栏 */}
                <div className="p-6 pt-24 md:pt-6 border-b border-zinc-800 flex justify-between items-start">
                  <div>
                    <div className="flex items-center gap-2 text-xs font-mono mb-2">
                      <span className={`w-2 h-2 rounded-full animate-pulse ${activeCity.bgColor}`}></span>
                      <span className={activeCity.color}>DATA_LOADED // LOC: {activeCity.lat.toFixed(2)}, {activeCity.lng.toFixed(2)}</span>
                    </div>
                    <h2 className={`text-4xl font-black uppercase tracking-tighter ${activeCity.color} drop-shadow-[0_0_10px_currentColor]`}>
                      {activeCity.label}
                    </h2>
                    <h3 className="text-xl font-bold text-white mt-1">{activeCity.name}</h3>
                  </div>
                  <button 
                    onClick={closePanel}
                    className="p-2 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white rounded-sm border border-zinc-700 transition-colors shadow-lg"
                  >
                    <IconX size={20} />
                  </button>
                </div>

                {/* 滚动内容区 */}
                <div className="flex-1 overflow-y-auto no-scrollbar p-6 space-y-8">
                  
                  {/* 文化风格 */}
                  <section>
                    <h4 className="flex items-center gap-2 text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3 border-b border-zinc-800 pb-2">
                      <IconMusic size={14} /> 风格特征 (Style)
                    </h4>
                    <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-sm border-l-4" style={{borderLeftColor: activeCity.bgColor.replace('bg-', '')}}>
                      <div className={`font-bold text-lg mb-2 ${activeCity.color}`}>
                        {activeCity.style}
                      </div>
                      <p className="text-zinc-400 text-sm leading-relaxed text-justify">
                        {activeCity.desc}
                      </p>
                    </div>
                  </section>

                  {/* 代表人物 */}
                  <section>
                    <h4 className="flex items-center gap-2 text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3 border-b border-zinc-800 pb-2">
                      <IconUser size={14} /> 核心代表 (Icons)
                    </h4>
                    <ul className="space-y-2">
                      {activeCity.rappers.map((rapper, index) => (
                        <li key={index} className="bg-zinc-900/50 border border-zinc-800 p-3 flex items-center gap-3 hover:bg-zinc-800 transition-colors cursor-default group">
                          <span className={`text-xs font-mono font-bold w-6 opacity-30 group-hover:opacity-100 ${activeCity.color}`}>0{index + 1}</span>
                          <span className="text-zinc-200 text-sm font-medium">{rapper}</span>
                        </li>
                      ))}
                    </ul>
                  </section>
                </div>

                {/* 底部装饰 */}
                <div className="p-6 border-t border-zinc-800 bg-zinc-900/50">
                  <button className={`w-full py-3 text-sm font-bold uppercase tracking-widest text-zinc-900 transition-all duration-300 shadow-lg ${activeCity.bgColor} hover:opacity-80`}>
                    接入城市频段
                  </button>
                </div>
              </>
            )}
          </div>

          {/* --- 底部复古音乐播放器 --- */}
          <footer className="absolute bottom-0 w-full z-40 border-t border-zinc-800 bg-zinc-950/80 backdrop-blur-md p-4">
            <div className="max-w-screen-2xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              
              <div className="flex items-center gap-4 w-full md:w-auto">
                <div className={`w-10 h-10 rounded-full bg-zinc-900 border-2 border-zinc-700 flex items-center justify-center ${isPlaying ? 'animate-[spin_3s_linear_infinite]' : ''}`}>
                  <div className="w-3 h-3 rounded-full bg-zinc-950 border border-red-500"></div>
                </div>
                <div>
                  <div className="text-[10px] text-red-500 font-bold tracking-widest uppercase flex items-center gap-2 mb-1">
                    Global Broadcast {isPlaying && <IconRadio size={10} className="animate-pulse" />}
                  </div>
                  <div className="font-mono text-sm text-zinc-300 truncate max-w-[200px] md:max-w-full">
                    {activeCity ? `信号同步: ${activeCity.label} Cipher` : "等待接入空间站信号..."}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-6">
                <button 
                  onClick={() => setIsPlaying(!isPlaying)}
                  className="w-10 h-10 bg-red-600 hover:bg-red-500 rounded-sm flex items-center justify-center text-white transition-colors border-2 border-red-800 hover:shadow-[0_0_15px_rgba(220,38,38,0.5)] shrink-0"
                >
                  {isPlaying ? <IconPause size={16} fill="currentColor" /> : <IconPlay size={16} fill="currentColor" className="ml-0.5" />}
                </button>
                
                <div className="hidden md:flex flex-col gap-1 w-32">
                  <div className="flex justify-between items-center text-[10px] text-zinc-500 font-mono">
                    <span>SYS.VOL</span>
                    <IconVolume2 size={12} />
                  </div>
                  <div className="h-1 w-full bg-zinc-800 rounded-full overflow-hidden">
                    <div className="h-full w-2/3 bg-red-500"></div>
                  </div>
                </div>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NahfiHipHopMuseum />);
  </script>
</body>
</html>
