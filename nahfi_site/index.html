<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nahfi - 3D Explore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.28/build/spline-viewer.js"></script>
  <style>
    @import url(<script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.68/build/spline-viewer.js"></script>
<spline-viewer url="https://prod.spline.design/qefAA4ph1RCs2Hxm/scene.splinecode"></spline-viewer>);
    
    body {
      background-color: #000;
      color: #d1d5db;
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
    }

    /* 全屏 3D 容器 */
    .hero-3d {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* 右侧选项栏美化 */
    .glass-menu {
      position: absolute;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 1.5rem;
      z-index: 20;
    }

    .menu-item {
      display: block;
      width: 100%;
      padding: 0.75rem 1.25rem;
      margin: 0.5rem 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      transition: all 0.3s ease;
      text-align: center;
      font-size: 0.875rem;
      color: #fff;
    }

    .menu-item:hover {
      background: #fff;
      color: #000;
      transform: scale(1.05);
    }

    /* 隐藏 Spline 的 Logo（虽然它们有 Logo 保护，但可以用这招隐藏底部条） */
    spline-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="min-h-screen">

  <nav class="absolute top-0 w-full p-6 z-30">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold tracking-tighter text-white">NAHFI</h1>
      <ul class="hidden md:flex space-x-8 text-sm uppercase tracking-widest text-gray-400">
        <li><a href="#gallery" class="hover:text-white transition">Gallery</a></li>
        <li><a href="#windy-map" class="hover:text-white transition">Weather</a></li>
        <li><a href="#blog" class="hover:text-white transition">Blog</a></li>
      </ul>
    </div>
  </nav>

  <section class="hero-3d">
    <spline-viewer url="https://prod.spline.design/6Wq1Q7YTesEglh7t/scene.splinecode"></spline-viewer>

    <div class="glass-menu shadow-2xl">
      <p class="text-xs text-gray-500 mb-4 text-center font-bold">NAHFI INTERACT</p>
      <button class="menu-item" onclick="alert('这里可以联动Spline的状态切换')">重置视角</button>
      <button class="menu-item">切换配色</button>
      <button class="menu-item">动画 A</button>
      <button class="menu-item">动画 B</button>
      <div class="mt-4 pt-4 border-t border-white/10 text-[10px] text-center text-gray-400">
        Drag to Orbit<br>Scroll to Zoom
      </div>
    </div>

    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce">
        <span class="text-xs tracking-widest text-gray-500">SCROLL DOWN</span>
    </div>
  </section>

  <section id="windy-map" class="py-24 bg-black">
    <div class="container mx-auto px-4">
        <h2 class="text-center text-2xl font-light mb-12 tracking-widest text-white">REALTIME ENVIRONMENT</h2>
        <div class="rounded-3xl overflow-hidden shadow-2xl border border-white/10">
            <iframe
                src="https://embed.windy.com/embed2.html?lat=30.67&lon=104.06&zoom=6&level=surface&overlay=wind&product=ecmwf&menu=&marker=&calendar=&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"
                frameborder="0"
                style="width: 100%; height: 600px; border: none;"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </div>
    </div>
  </section>

  <section id="gallery" class="py-24 bg-[#0a0a0a]">
    <div class="container mx-auto px-4">
      <h2 class="text-4xl font-bold text-white mb-12">Gallery</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-1">
        <div class="aspect-square bg-gray-800 hover:opacity-80 transition cursor-pointer overflow-hidden">
            <img src="placeholder-art1.jpg" class="w-full h-full object-cover">
        </div>
        <div class="aspect-square bg-gray-700 hover:opacity-80 transition cursor-pointer overflow-hidden">
            <img src="placeholder-art2.jpg" class="w-full h-full object-cover">
        </div>
        <div class="aspect-square bg-gray-800 hover:opacity-80 transition cursor-pointer overflow-hidden">
            <img src="placeholder-art3.jpg" class="w-full h-full object-cover">
        </div>
      </div>
    </div>
  </section>

  <section id="blog" class="py-24 bg-black">
    <div class="container mx-auto max-w-4xl px-4">
      <h2 class="text-4xl font-bold text-white mb-12">Dev Log</h2>
      <div id="blog-posts" class="space-y-12">
        <div class="group">
          <p class="text-sm text-gray-500 mb-2">2026.03.11</p>
          <h3 class="text-2xl font-semibold text-white group-hover:text-blue-400 transition cursor-pointer">Nahfi 3D 网站构建记录</h3>
          <p class="text-gray-400 mt-4 leading-relaxed">今天成功接入了 Spline 渲染引擎，Nahfi 的 3D 模型在网页上运行非常流畅...</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="py-12 border-t border-white/5 text-center text-xs text-gray-600 tracking-widest">
    © 2026 NAHFI.ASIA / ALL RIGHTS RESERVED.
  </footer>

</body>
</html>
